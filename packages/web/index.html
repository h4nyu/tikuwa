<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>在庫管理</title>
  <meta name="theme-color" content="#1f7a5c" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="page-title">在庫一覧</h1>
    </header>

    <main id="view-root">
      <section id="view-list" class="view">
        <div class="search-bar">
          <input
            id="search-input"
            type="search"
            placeholder="商品名・カテゴリ・バーコードで検索(カンマ区切りで複数可)"
            autocomplete="off"
          />
          <button id="refresh-list" class="icon-btn" type="button" aria-label="一覧を更新">🔄</button>
        </div>
        <div class="sort-row">
          <label for="list-sort" class="sort-label">並び順</label>
          <select id="list-sort">
            <option value="name">商品名順</option>
            <option value="category">カテゴリ順</option>
            <option value="stock-asc">現在庫が少ない順</option>
            <option value="stock-desc">現在庫が多い順</option>
            <option value="needed-desc">不足数が多い順</option>
          </select>
        </div>
        <div id="category-filter" class="chip-row"></div>
        <ul id="product-list" class="product-list"></ul>
        <p id="list-empty" class="empty-state" hidden>商品がありません。右下の + から登録してください。</p>
      </section>

      <section id="view-scan" class="view" hidden>
        <div id="scan-reader" class="scan-reader"></div>
        <p id="scan-hint" class="scan-hint">バーコードをカメラに写してください</p>
        <button id="manual-barcode-btn" class="btn btn-secondary btn-block" type="button">
          ⌨️ バーコードを手動入力
        </button>
      </section>

      <section id="view-replenishment" class="view" hidden>
        <div class="section-header">
          <p class="section-desc">目標在庫数に対して不足している商品です。</p>
          <button id="refresh-replenishment" class="icon-btn" type="button" aria-label="補充リストを更新">🔄</button>
        </div>
        <div class="sort-row">
          <label for="replenishment-sort" class="sort-label">並び順</label>
          <select id="replenishment-sort">
            <option value="needed-desc">不足数が多い順</option>
            <option value="needed-asc">不足数が少ない順</option>
            <option value="name">商品名順</option>
            <option value="category">カテゴリ順</option>
            <option value="stock-asc">現在庫が少ない順</option>
          </select>
        </div>
        <div id="category-filter-replenishment" class="chip-row"></div>
        <button id="export-replenishment-csv" class="btn btn-secondary btn-block" style="margin-bottom: 10px;">
          CSVで書き出す(Excelで開けます)
        </button>
        <ul id="replenishment-list" class="product-list"></ul>
        <p id="replenishment-empty" class="empty-state" hidden>補充が必要な商品はありません。</p>
      </section>

      <section id="view-delivery" class="view" hidden>
        <div class="search-bar">
          <input
            id="delivery-search"
            type="search"
            placeholder="商品名・追跡番号・運送会社・カテゴリで検索"
            autocomplete="off"
          />
          <button id="refresh-delivery" class="icon-btn" type="button" aria-label="物流管理を更新">🔄</button>
        </div>
        <div id="delivery-category-filter" class="chip-row"></div>
        <button id="export-delivery-csv" class="btn btn-secondary btn-block" style="margin-top: 10px;">
          CSVで書き出す(Excelで開けます)
        </button>
        <ul id="delivery-list" class="tx-list"></ul>
        <p id="delivery-empty" class="empty-state" hidden>まだ記録がありません。</p>
      </section>
    </main>

    <button id="fab-add" class="fab" aria-label="商品を追加">+</button>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="list" data-title="在庫一覧">
        <span class="nav-icon">📋</span><span>一覧</span>
      </button>
      <button class="nav-btn" data-view="scan" data-title="バーコードスキャン">
        <span class="nav-icon">📷</span><span>スキャン</span>
      </button>
      <button class="nav-btn" data-view="replenishment" data-title="補充リスト">
        <span class="nav-icon">🛒</span><span>補充</span>
      </button>
      <button class="nav-btn" data-view="delivery" data-title="物流管理">
        <span class="nav-icon">📦</span><span>物流</span>
      </button>
    </nav>

    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <div id="modal" class="modal" role="dialog" aria-modal="true">
        <button id="modal-close-btn" class="modal-close" type="button" aria-label="閉じる">×</button>
        <div id="modal-content" class="modal-content"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
